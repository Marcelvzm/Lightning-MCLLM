# Genre presets for the default environment. Pick one in the GUI dropdown to
# apply its BPM and start the lead chase. recommended_chases / recommended_scenes
# are surfaced as one-click buttons next to the genre selector.
#
# Add your own. The LLM can edit this file via MCP.

genres:
  - name: techno
    description: Driving 4-on-the-floor, BPM 128
    bpm: 128
    lead_chase: red_pulse
    recommended_chases: [red_pulse, mh_alternating_sweep]
    recommended_scenes: [red_pulse_on, mh_beam_open_blue]

  - name: house
    description: Smoother grooves, BPM 124
    bpm: 124
    lead_chase: red_pulse
    recommended_chases: [red_pulse, par_color_walk]
    recommended_scenes: [warm_idle, mh_beam_open_amber]

  - name: ambient
    description: Slow, no beat lock — uses time-anchored chase
    bpm: 80
    lead_chase: par_color_walk
    recommended_chases: [par_color_walk]
    recommended_scenes: [warm_idle]

  - name: dnb
    description: Drum and bass, BPM 174
    bpm: 174
    lead_chase: red_pulse
    recommended_chases: [red_pulse, mh_alternating_sweep]
    recommended_scenes: [mh_beam_open_blue]

# Colors-Bank — alle Farb-bezogenen Trigger.
# Layout:
#   1-4   Setter (statische Color+Dim auf Gerät)
#   5-8   Random Color (Off-Grid Wechsel)
#   9     Blackout-Latch (muscle memory)
#   10-13 Off-Scenes (per Gerät + All)
#   14    RX Walk (12-Mode-Cycle)
#   15-19 Direkte Color-Snaps via all_color + palette-args (Rot/Blau/Grün/Weiß/Warm)
name: colors
description: Bank für alle Farb-bezogenen Scenes & Chases.

slots:
  # ── Setter (statische Color+Dim auf Gerät) ──────────────────────────────
  - { id: 1, kind: scene, name: bar_col_dim,        label: "Bar Col" }
  - { id: 2, kind: scene, name: par_col_dim,        label: "Par Col" }
  - { id: 3, kind: scene, name: rx350_col,          label: "RX Col" }
  - { id: 4, kind: scene, name: all_color,          label: "All Col" }

  # ── Random Color (Off-Grid Wechsel) ─────────────────────────────────────
  - { id: 5, kind: chase, name: bar_random_color,   label: "Bar Rnd" }
  - { id: 6, kind: chase, name: par_random_color,   label: "Par Rnd" }
  - { id: 7, kind: chase, name: rx350_random_color, label: "RX Rnd" }
  - { id: 8, kind: chase, name: all_random_color,   label: "All Rnd" }

  # ── Blackout-Latch (universell, Slot 9 für muscle memory) ──────────────
  - { id: 9, kind: blackout, label: "BLACKOUT", fade_seconds: 0.0 }

  # ── Off-Scenes (per Gerät + All) ────────────────────────────────────────
  - { id: 10, kind: scene, name: bar_off,           label: "Bar Off" }
  - { id: 11, kind: scene, name: par_off,           label: "Par Off" }
  - { id: 12, kind: scene, name: rx350_off,         label: "RX Off" }
  - { id: 13, kind: scene, name: all_off,           label: "All Off" }

  # ── RX Walk ─────────────────────────────────────────────────────────────
  - { id: 14, kind: chase, name: rx350_mode_walk,   label: "RX Walk" }

  # ── Direkte Color-Snaps fürs gesamte Rig (all_color + palette args) ─────
  - { id: 15, kind: scene, name: all_color, label: "Rot",   args: { col: rot } }
  - { id: 16, kind: scene, name: all_color, label: "Blau",  args: { col: blau } }
  - { id: 17, kind: scene, name: all_color, label: "Grün",  args: { col: gruen } }
  - { id: 18, kind: scene, name: all_color, label: "Weiß",  args: { col: weiss } }
  - { id: 19, kind: scene, name: all_color, label: "Warm",  args: { col: warm } }

  # ── Color Fade (kontinuierlich durch Palette) ──────────────────────────
  - { id: 20, kind: chase, name: bar_color_fade,    label: "Bar Fade" }
  - { id: 21, kind: chase, name: par_color_fade,    label: "Par Fade" }
  - { id: 22, kind: chase, name: rx350_color_fade,  label: "RX Fade" }
  - { id: 23, kind: chase, name: all_color_fade,    label: "All Fade" }

  # ── Color Step (diskret pro Beat) ──────────────────────────────────────
  - { id: 24, kind: chase, name: bar_color_step,    label: "Bar Step" }
  - { id: 25, kind: chase, name: par_color_step,    label: "Par Step" }
  - { id: 26, kind: chase, name: rx350_color_step,  label: "RX Step" }
  - { id: 27, kind: chase, name: all_color_step,    label: "All Step" }

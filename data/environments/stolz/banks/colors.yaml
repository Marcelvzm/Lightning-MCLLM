# Colors-Bank — pro Gerät: Color-Setter / Random / Off (3 Slots je
# Bar+Par, 2 Slots für RX).
# Folgende Chases existieren weiter, sind aber nicht im Pad:
#   rx350_mode_walk, rx350_random_color, all_random_color.
# Über die Chase-Liste in der GUI startbar.
name: colors
description: Bank für alle Farb-bezogenen Scenes & Chases.

slots:
  - { id: 1, kind: scene, name: bar_col_dim,        label: "Bar Col" }
  - { id: 2, kind: chase, name: bar_random_color,   label: "Bar Rnd" }
  - { id: 3, kind: scene, name: bar_off,            label: "Bar Off" }

  - { id: 4, kind: scene, name: par_col_dim,        label: "Par Col" }
  - { id: 5, kind: chase, name: par_random_color,   label: "Par Rnd" }
  - { id: 6, kind: scene, name: par_off,            label: "Par Off" }

  - { id: 7, kind: scene, name: rx350_col,          label: "RX Col" }
  - { id: 8, kind: scene, name: rx350_off,          label: "RX Off" }

  - { id: 9, kind: blackout, label: "BLACKOUT", fade_seconds: 0.0 }

# Hardtekk-Pad — 165-180 BPM, weiß+rot, hart, dense.
# Layout folgt dem Hardtekk-Drama: oben = laufende Base, mitte = Build,
# unten = Drop + Panic.
name: hardtekk
description: Hardtekk-Workflow — Idle → Build → Halt → DROP → Reset.

slots:
  # ── Spalte 1: Running Base (red bed + kick) ─────────────────────────
  - { id: 1, kind: scene, name: all_color, label: "Red Bed", args: { col: rot } }
  - { id: 2, kind: chase, name: kick_pulse_bar,    label: "Kick 4OTF" }
  - { id: 3, kind: chase, name: hardtekk_density,  label: "Density" }

  # ── Spalte 2: Build / Anticipation ──────────────────────────────────
  - { id: 4, kind: chase, name: rx350_random_flash, label: "RX Flash" }
  - { id: 5, kind: chase, name: bar_random_flashes, label: "Bar Flashes" }
  - { id: 6, kind: chase, name: anticipation_halt,  label: "HALT (Z1)" }

  # ── Spalte 3: Drop / Peak / Panic ───────────────────────────────────
  - { id: 7, kind: scene, name: hardstyle_drop,      label: "DROP",      fade_seconds: 0.0 }
  - { id: 8, kind: chase, name: peak_strobe_volley,  label: "Peak Volley" }
  - { id: 9, kind: blackout, label: "BLACKOUT", fade_seconds: 0.0 }

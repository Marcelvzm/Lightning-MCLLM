# Live-Pad — die 9 Trigger die du im laufenden Set am häufigsten brauchst.
# Drei Spalten Logik:
#   1-3  Sofort-Farb-Snaps     (instant color wash)
#   4-6  Beat-locked Chases    (running grooves + movement)
#   7-9  Peaks + Reset         (hits, build, panic)
#
# Schalt im GUI-Dropdown von "main" auf "live" um, dann hast du die
# Tasten 1-9 auf diesem Layout.
name: live
description: Live-Performance-Pad — DJ-Workflow.

slots:
  # ── Spalte 1: Sofort-Color-Snaps ────────────────────────────────────
  - { id: 1, kind: scene, name: all_color, label: "Rot",  args: { col: rot } }
  - { id: 2, kind: scene, name: all_color, label: "Blau", args: { col: blau } }
  - { id: 3, kind: scene, name: all_color, label: "Warm", args: { col: warm } }

  # ── Spalte 2: Running Grooves ───────────────────────────────────────
  - { id: 4, kind: chase, name: red_pulse,        label: "Pulse Rot" }
  - { id: 5, kind: chase, name: mh_drift_blinks,  label: "Bar Drift" }
  - { id: 6, kind: chase, name: par_color_walk,   label: "Color Walk" }

  # ── Spalte 3: Peaks / Drop-Tools / Panic ────────────────────────────
  - { id: 7, kind: chase, name: anticipation_halt, label: "Halt (Z1)" }
  - { id: 8, kind: scene, name: white_hit,         label: "WHITE HIT" }
  - { id: 9, kind: blackout, label: "BLACKOUT", fade_seconds: 0.0 }

# Live-Pad fürs stolz-Rig. Demonstriert wie Bank-Slot-Args eine einzige
# parametrisierte Scene/Chase in mehrere "Varianten" entfalten.
name: main
description: Live-Pad — same scene/chase, verschiedene Palette-Varianten via slot-args.

slots:
  # Color-Snaps — alle nutzen dieselbe `all_color`-Scene mit args-Override.
  - { id: 1, kind: scene, name: all_color, label: "Rot",   args: { col: rot } }
  - { id: 2, kind: scene, name: all_color, label: "Blau",  args: { col: blau } }
  - { id: 3, kind: scene, name: all_color, label: "Grün",  args: { col: gruen } }
  - { id: 7, kind: scene, name: all_color, label: "Weiß",  args: { col: weiss } }
  - { id: 8, kind: scene, name: all_color, label: "Warm",  args: { col: warm } }

  # MH-Chase — defaults (rot @ wheel 14) und ein Override.
  - { id: 4, kind: chase, name: mh_drift_blinks, label: "MH Drift Rot" }
  - id: 5
    kind: chase
    name: mh_drift_blinks
    label: "MH Drift Blau"
    args: { baseline_wheel: 34, baseline_dim: 80, drift_seconds: 6.0 }

  - { id: 9, kind: blackout, label: "BLACKOUT", fade_seconds: 0.0 }

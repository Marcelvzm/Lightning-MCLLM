  - { id: 5, kind: chase, name: bar_wave_long_hori,   label: "Wave L Hori" }
  - { id: 6, kind: chase, name: bar_wave_long_verti,  label: "Wave L Vert" }
  - { id: 7, kind: chase, name: bar_wave_short_hori,  label: "Wave S Hori" }
  - { id: 8, kind: chase, name: bar_wave_short_verti, label: "Wave S Vert" }
  - { id: 9, kind: blackout, label: "BLACKOUT", fade_seconds: 0.0 }

# Movements-Bank — Pan/Tilt-Bewegungen, Sweeps, Drifts, Position-Snaps.
# bar_diagonal_sweep + bar_chaos_movement existieren weiter als Chases,
# sind nur nicht im 9-Slot-Pad (zugänglich über die Chase-Liste).
name: movements
description: Bank für alle Bewegungs-bezogenen Scenes & Chases (Pan/Tilt-Patterns).

slots:
  - { id: 1, kind: chase, name: bar_alternate, label: "Alt Vert" }
  - id: 2
    kind: chase
    name: bar_alternate
    label: "Alt Hori"
    args: { a_pan: 50, a_tilt: 128, b_pan: 200, b_tilt: 128 }
  - { id: 3, kind: chase, name: bar_turn_rechts, label: "Turn →" }
  - { id: 4, kind: chase, name: bar_turn_links,  label: "Turn ←" }
  - { id: 5, kind: chase, name: bar_turn_random, label: "Turn Rnd" }
  - { id: 6, kind: chase, name: bar_slow_walk,   label: "Slow Walk" }
  - { id: 7, kind: chase, name: bar_wave_long,   label: "Wave Long" }
  - { id: 8, kind: chase, name: bar_wave_short,  label: "Wave Short" }
  - { id: 9, kind: blackout, label: "BLACKOUT", fade_seconds: 0.0 }

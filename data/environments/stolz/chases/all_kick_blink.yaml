# Synchroner Dimmer-Kick auf ALLEN Fixtures gleichzeitig — pars + bar
# pulsen auf 255, RX350 auf rx350_color, dann release. Off-grid Beat-
# Stellen wie bei den per-Group-kick-blinks, aber ALLES feuert auf
# denselben Beats statt versetzt.
#
# Schreibt nur dimmer (pars/bar) bzw. macro (rx350) — Color/Position/Gobo
# der underlying Voices bleiben unangetastet (echtes Overlay).
#
# WICHTIG — RX350: hat keinen Dimmer-Channel, wird per macro auf
# rx350_color gesnappt während eines Blinks. Nach dem release fällt es auf
# whatever der underlying Voice malt (z.B. rx350_mode_walk) bzw. macro=0
# wenn nichts darunter läuft.
#
# Showtecs: rausgelassen — sie haben keinen Master-Dimmer (RGB regelt
# Helligkeit direkt). Filter würde nichts tun.
#
# 16 Trigger-Punkte über 16 Beats:
#   12× single  → alle Fixtures pulsen kurz
#    3× double  → zweimal in dichter Folge (wie 8-tel)  (Beats 3, 12)
#    1× triple  → dreimal in dichter Folge (Beat 8 — Peak)
name: all_kick_blink
description: |
  Synchroner Off-Grid-Blink auf allen Fixtures (pars + bar + rx350)
  gleichzeitig. Echtes Overlay — schreibt nur Dimmer/Macro.

loop: true
length_beats: 16

parameters:
  rx350_color:
    type: int
    default: 103     # white
    min: 0
    max: 255
    description: "Macro-Wert für RX350 während der Blinks. 11=red, 34=green, 57=blue, 80=yellow, 103=white, 218=rgb, 241=all."

steps:

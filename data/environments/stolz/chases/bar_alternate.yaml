# Bar-Heads in zwei Zickzack-Paaren — head-1+head-3 (Paar A) vs.
# head-2+head-4 (Paar B). Phase 1: A → Position A, B → Position B.
# Phase 2: getauscht. Pro Position eigenes (pan, tilt)-Paar via Parameter.
#
# Default = vertikale Alternation (tilt-swap zwischen Decke und Publikum).
# Horizontale Alternation per Slot-Args:
#   args: { a_pan: 50, a_tilt: 128, b_pan: 200, b_tilt: 128 }
# (linker/rechter Zickzack mit zentriertem Tilt.)
#
# Schreibt KEINE Color/Gobo/Dimmer — die kommen aus den anderen Banks.
name: bar_alternate
description: |
  Bar-Heads-Alternate. Default vertikal (tilt 50 ↔ 165). Horizontal via
  args (a_pan: 50, a_tilt: 128, b_pan: 200, b_tilt: 128).

loop: true
length_beats: 8

parameters:
  a_pan:
    type: int
    default: 128
    min: 0
    max: 255
    description: "Pan-Wert für Position A. Default vertikal = zentriert (128)."
  a_tilt:
    type: int
    default: 50
    min: 0
    max: 255
    description: "Tilt-Wert für Position A. Default vertikal = Decke (50)."
  b_pan:
    type: int
    default: 128
    min: 0
    max: 255
    description: "Pan-Wert für Position B."
  b_tilt:
    type: int
    default: 165
    min: 0
    max: 255
    description: "Tilt-Wert für Position B. Default vertikal = Publikum (165)."

steps:
  # ── Phase 1: Pair A (head-1 + head-3) → Position A; Pair B → Position B ──
  - at_beat: 0
    actions:
      - { kind: snap, group: { name: head-1 }, values: { position/pan: "${a_pan}", position/tilt: "${a_tilt}", movement/speed: 80 } }
      - { kind: snap, group: { name: head-3 }, values: { position/pan: "${a_pan}", position/tilt: "${a_tilt}", movement/speed: 80 } }
      - { kind: snap, group: { name: head-2 }, values: { position/pan: "${b_pan}", position/tilt: "${b_tilt}", movement/speed: 80 } }
      - { kind: snap, group: { name: head-4 }, values: { position/pan: "${b_pan}", position/tilt: "${b_tilt}", movement/speed: 80 } }

  # ── Phase 2: getauscht ───────────────────────────────────────────────────
  - at_beat: 4
    actions:
      - { kind: snap, group: { name: head-1 }, values: { position/pan: "${b_pan}", position/tilt: "${b_tilt}", movement/speed: 80 } }
      - { kind: snap, group: { name: head-3 }, values: { position/pan: "${b_pan}", position/tilt: "${b_tilt}", movement/speed: 80 } }
      - { kind: snap, group: { name: head-2 }, values: { position/pan: "${a_pan}", position/tilt: "${a_tilt}", movement/speed: 80 } }
      - { kind: snap, group: { name: head-4 }, values: { position/pan: "${a_pan}", position/tilt: "${a_tilt}", movement/speed: 80 } }

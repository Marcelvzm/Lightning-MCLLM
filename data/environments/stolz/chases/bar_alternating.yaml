# Heads 1+3 vs 2+4 abwechselnd. Erst Outer-1 + Inner-3 hoch, dann
# Outer-4 + Inner-2 hoch — "Schach"-Pattern.
name: bar_alternating
description: Bar — Heads 1+3 dann 2+4 abwechselnd, je 2 Beats.
loop: true
length_beats: 4
steps:
  - at_beat: 0
    actions:
      - { kind: snap, group: { name: head-1 }, values: { dimmer: 255 } }
      - { kind: snap, group: { name: head-3 }, values: { dimmer: 255 } }
      - { kind: snap, group: { name: head-2 }, values: { dimmer: 0 } }
      - { kind: snap, group: { name: head-4 }, values: { dimmer: 0 } }
  - at_beat: 2
    actions:
      - { kind: snap, group: { name: head-1 }, values: { dimmer: 0 } }
      - { kind: snap, group: { name: head-3 }, values: { dimmer: 0 } }
      - { kind: snap, group: { name: head-2 }, values: { dimmer: 255 } }
      - { kind: snap, group: { name: head-4 }, values: { dimmer: 255 } }

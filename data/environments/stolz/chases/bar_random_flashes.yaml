# Overlay-Chase NUR für die Bar-Heads. Schreibt AUSSCHLIESSLICH den
# Dimmer-Channel — Color/Gobo/Tilt/Pan bleiben unangetastet, also kann
# parallel ein anderer Bar-Chase (z.B. bar_pair_alternate_tilt) darunter
# laufen und Position/Farbe definieren.
#
# Pattern: 4 Bursts pro 16-Beat-Loop. Pro Burst werden 1-3 Heads mit
# Off-Grid-Timing nacheinander auf flash_dimmer gesnapt. Snaps
# AKKUMULIEREN — am Ende eines Bursts können je nach Burst 1, 2, 3 oder
# 4 Heads gleichzeitig leuchten. Dann release-all → underlying Chase
# malt den Dimmer wieder. Bis zum nächsten Burst sind die Heads also
# wieder unter Kontrolle des darunterliegenden Chase.
#
# Ohne darunterliegenden Chase: Heads sind zwischen den Bursts dunkel
# (nichts schreibt dimmer) → wirkt dann wie blanke Random-Flashes.
name: bar_random_flashes
description: |
  Overlay-Chase für die Bar-Heads. Random-anmutende Flashes (Off-Grid),
  pro Burst leuchten 1-4 Heads gleichzeitig. Schreibt nur Dimmer →
  kann jederzeit über jeden anderen Bar-Chase gelegt werden.

loop: true
length_beats: 16

parameters:
  flash_dimmer:
    type: int
    default: 255
    min: 0
    max: 255
    description: "Helligkeit der Flashes (0-255)."
  flash_color:
    type: int
    default: 0          # white (open) — klassische Flash-Farbe
    min: 0
    max: 255
    description: "color/wheel Wert während der Flashes. 0=white, 14=red, 24=green, 34=blue, 44=yellow, 64=orange, 74=purple. Während eines Flashes überschreibt das die Farbe vom darunterliegenden Chase, beim release-Reset kommt sie zurück."

steps:
  # ── Burst 1 (Beats 0-3.5) — baut auf bis 4 Heads gleichzeitig ───────────
  - at_beat: 0.4
    actions: [ { kind: snap, group: { name: head-2 }, values: { dimmer: "${flash_dimmer}", color/wheel: "${flash_color}" } } ]
  - at_beat: 0.8
    actions: [ { kind: snap, group: { name: head-4 }, values: { dimmer: "${flash_dimmer}", color/wheel: "${flash_color}" } } ]
  - at_beat: 1.5
    actions: [ { kind: snap, group: { name: head-1 }, values: { dimmer: "${flash_dimmer}", color/wheel: "${flash_color}" } } ]
  - at_beat: 2.7
    actions: [ { kind: snap, group: { name: head-3 }, values: { dimmer: "${flash_dimmer}", color/wheel: "${flash_color}" } } ]
  - at_beat: 3.5
    actions: [ { kind: release, group: { tag: bar } } ]

  # ── Burst 2 (Beats 4-7.5) — nur 3 Heads, andere Reihenfolge ─────────────
  - at_beat: 4.3
    actions: [ { kind: snap, group: { name: head-3 }, values: { dimmer: "${flash_dimmer}", color/wheel: "${flash_color}" } } ]
  - at_beat: 4.6
    actions: [ { kind: snap, group: { name: head-1 }, values: { dimmer: "${flash_dimmer}", color/wheel: "${flash_color}" } } ]
  - at_beat: 6.2
    actions: [ { kind: snap, group: { name: head-2 }, values: { dimmer: "${flash_dimmer}", color/wheel: "${flash_color}" } } ]
  - at_beat: 7.5
    actions: [ { kind: release, group: { tag: bar } } ]

  # ── Burst 3 (Beats 8-11.5) — schneller Aufbau, 3 Heads ──────────────────
  - at_beat: 8.2
    actions: [ { kind: snap, group: { name: head-4 }, values: { dimmer: "${flash_dimmer}", color/wheel: "${flash_color}" } } ]
  - at_beat: 9.7
    actions: [ { kind: snap, group: { name: head-2 }, values: { dimmer: "${flash_dimmer}", color/wheel: "${flash_color}" } } ]
  - at_beat: 10.1
    actions: [ { kind: snap, group: { name: head-3 }, values: { dimmer: "${flash_dimmer}", color/wheel: "${flash_color}" } } ]
  - at_beat: 11.5
    actions: [ { kind: release, group: { tag: bar } } ]

  # ── Burst 4 (Beats 12-15.5) — solo Head, dann Doppel-Snap ───────────────
  - at_beat: 12.4
    actions: [ { kind: snap, group: { name: head-1 }, values: { dimmer: "${flash_dimmer}", color/wheel: "${flash_color}" } } ]
  - at_beat: 14.3
    actions:
      - { kind: snap, group: { name: head-3 }, values: { dimmer: "${flash_dimmer}", color/wheel: "${flash_color}" } }
      - { kind: snap, group: { name: head-4 }, values: { dimmer: "${flash_dimmer}", color/wheel: "${flash_color}" } }
  - at_beat: 15.5
    actions: [ { kind: release, group: { tag: bar } } ]

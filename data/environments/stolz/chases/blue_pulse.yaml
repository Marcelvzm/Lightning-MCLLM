name: blue_pulse
description: 4OTF blau pulse auf Pars.
loop: true
length_beats: 4
steps:
  - at_beat: 0
    actions:
      - { kind: snap,       group: { tag: par }, scene: pars_blue_full }
      - { kind: transition, group: { tag: par }, scene: pars_blue_dim, fade_seconds: 0.4 }
  - at_beat: 1
    actions:
      - { kind: snap,       group: { tag: par }, scene: pars_blue_full }
      - { kind: transition, group: { tag: par }, scene: pars_blue_dim, fade_seconds: 0.4 }
  - at_beat: 2
    actions:
      - { kind: snap,       group: { tag: par }, scene: pars_blue_full }
      - { kind: transition, group: { tag: par }, scene: pars_blue_dim, fade_seconds: 0.4 }
  - at_beat: 3
    actions:
      - { kind: snap,       group: { tag: par }, scene: pars_blue_full }
      - { kind: transition, group: { tag: par }, scene: pars_blue_dim, fade_seconds: 0.4 }

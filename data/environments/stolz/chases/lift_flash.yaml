# Single accent flash auf Beat 3.5 (das "and-of-4") — der "lift" der
# einen neuen Bar einleitet. Häufig in Hardtekk verwendet.
name: lift_flash
description: Lift flash auf Beat 3.5 (& von 4) — bar boundary marker.
loop: true
length_beats: 4
steps:
  - at_beat: 3.5
    actions:
      - kind: snap
        group: { tag: par }
        values: { color/red: 255, color/green: 255, color/blue: 255, color/white: 255, dimmer: 255 }
      - kind: transition
        group: { tag: par }
        values: { color/red: 0, color/green: 0, color/blue: 0, color/white: 0, dimmer: 0 }
        fade_seconds: 0.15

# Reiner Dimmer-Filter für die Pars: 1 Blink pro Beat zu krummen
# Sub-Beat-Stellen, gelegentlich 2-3 gleichzeitig.
#
# **Schreibt NUR `dimmer: 255`** — keine Farben, kein Macro, kein Strobe.
# Damit ist der Chase ein echtes Overlay: Color/Macro/Strobe der underlying
# Voice (z.B. einer farbigen Wash-Scene) bleiben unangetastet, der Dimmer
# wird kurz auf voll gesnappt und 0.15 Beats später per release droppt
# der Chase seine Voice → underlying Dim-Wert paintet wieder durch.
#
# Use case:
#   snap_scene("pars_red_dim")            # Pars rot, dim 30
#   start_chase("pars_kick_blink")        # Pars blitzen kurz auf 255 in rot
#
# WICHTIG — Fixture-Auswahl:
#   * cameo-1/2/3 + pad-1 + par64 haben einen echten dimmer-Channel.
#   * Die SHOWTECS sind RAUSGELASSEN — sie haben keinen Master-Dimmer
#     (RGB regelt die Helligkeit direkt). Ein dimmer-only Filter würde
#     dort nichts tun.
#
# 16 Trigger-Punkte über 16 Beats:
#   12× single  → ein Par
#    3× double  → zwei Pars (Beats 3, 12)
#    1× triple  → drei Pars (Beat 8 — Peak)

name: pars_kick_blink
description: 1/Beat Pars dimmer-only blink (overlay), krumme Stellen, gelegentlich 2-3 gleichzeitig.
loop: true
length_beats: 16

steps:
  # Beat 0
  - at_beat: 0.3
    actions:
      - { kind: snap, group: { name: cameo-1 }, values: { dimmer: 255 } }
  - at_beat: 0.45
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 1
  - at_beat: 1.7
    actions:
      - { kind: snap, group: { name: pad-1 }, values: { dimmer: 255 } }
  - at_beat: 1.85
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 2
  - at_beat: 2.4
    actions:
      - { kind: snap, group: { name: cameo-3 }, values: { dimmer: 255 } }
  - at_beat: 2.55
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 3 — DOUBLE
  - at_beat: 3.6
    actions:
      - { kind: snap, group: { name: par64 },   values: { dimmer: 255 } }
      - { kind: snap, group: { name: cameo-2 }, values: { dimmer: 255 } }
  - at_beat: 3.75
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 4
  - at_beat: 4.2
    actions:
      - { kind: snap, group: { name: cameo-1 }, values: { dimmer: 255 } }
  - at_beat: 4.35
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 5
  - at_beat: 5.8
    actions:
      - { kind: snap, group: { name: cameo-2 }, values: { dimmer: 255 } }
  - at_beat: 5.95
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 6
  - at_beat: 6.3
    actions:
      - { kind: snap, group: { name: pad-1 }, values: { dimmer: 255 } }
  - at_beat: 6.45
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 7
  - at_beat: 7.5
    actions:
      - { kind: snap, group: { name: par64 }, values: { dimmer: 255 } }
  - at_beat: 7.65
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 8 — TRIPLE peak
  - at_beat: 8.4
    actions:
      - { kind: snap, group: { name: cameo-3 }, values: { dimmer: 255 } }
      - { kind: snap, group: { name: cameo-1 }, values: { dimmer: 255 } }
      - { kind: snap, group: { name: pad-1 },   values: { dimmer: 255 } }
  - at_beat: 8.6
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 9
  - at_beat: 9.7
    actions:
      - { kind: snap, group: { name: cameo-2 }, values: { dimmer: 255 } }
  - at_beat: 9.85
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 10
  - at_beat: 10.2
    actions:
      - { kind: snap, group: { name: cameo-3 }, values: { dimmer: 255 } }
  - at_beat: 10.35
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 11
  - at_beat: 11.6
    actions:
      - { kind: snap, group: { name: pad-1 }, values: { dimmer: 255 } }
  - at_beat: 11.75
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 12 — DOUBLE
  - at_beat: 12.5
    actions:
      - { kind: snap, group: { name: cameo-1 }, values: { dimmer: 255 } }
      - { kind: snap, group: { name: par64 },   values: { dimmer: 255 } }
  - at_beat: 12.65
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 13
  - at_beat: 13.3
    actions:
      - { kind: snap, group: { name: cameo-2 }, values: { dimmer: 255 } }
  - at_beat: 13.45
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 14
  - at_beat: 14.7
    actions:
      - { kind: snap, group: { name: cameo-3 }, values: { dimmer: 255 } }
  - at_beat: 14.85
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 15
  - at_beat: 15.4
    actions:
      - { kind: snap, group: { name: pad-1 }, values: { dimmer: 255 } }
  - at_beat: 15.55
    actions: [ { kind: release, group: { all: true } } ]

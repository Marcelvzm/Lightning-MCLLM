  - at_beat: 2.55
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 3 — DOUBLE
  - at_beat: 3.6
    actions:
      - { kind: snap, group: { name: showtec-3 }, values: { color/red: 255, color/green: 255, color/blue: 255, effect/macro: 0 } }
      - { kind: snap, group: { name: cameo-2 },   values: { color/red: 255, color/green: 255, color/blue: 255, dimmer: 255, effect/macro: 75 } }
  - at_beat: 3.75
    actions: [ { kind: release, group: { all: true } } ]


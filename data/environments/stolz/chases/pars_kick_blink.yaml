# Wie pars_random_blinks, aber auf 1/Beat eingetaktet — pro Beat genau
# ein Flash-Event, allerdings zu krummen Sub-Beat-Stellen (.2 bis .8)
# damit der Eindruck "random" bleibt. Meist flasht 1 Par, gelegentlich
# 2 oder 3 gleichzeitig (Beats 3, 8, 12) als Akzent.
#
# Designed als OVERLAY auf eine Background-Wash (z.B. pars_red_full):
# der snap überschreibt kurz weiß, der release droppt die Voices, der
# Wash paintet wieder durch.
#
# 16 Trigger-Punkte über 16 Beats:
#   12× single  → meistens nur 1 Par
#    3× double  → 2 Pars gleichzeitig (Beats 3, 12)
#    1× triple  → 3 Pars gleichzeitig (Beat 8 — Höhepunkt im Loop)

name: pars_kick_blink
description: 1/Beat pars-blink, krumme Sub-Beat-Stellen, gelegentlich 2-3 gleichzeitig.
loop: true
length_beats: 16

steps:
  # Beat 0
  - at_beat: 0.3
    actions:
      - { kind: snap, group: { name: cameo-1 }, values: { color/red: 255, color/green: 255, color/blue: 255, dimmer: 255, effect/macro: 75 } }
  - at_beat: 0.45
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 1
  - at_beat: 1.7
    actions:
      - { kind: snap, group: { name: showtec-2 }, values: { color/red: 255, color/green: 255, color/blue: 255, effect/macro: 0 } }
  - at_beat: 1.85
    actions: [ { kind: release, group: { all: true } } ]

  # Beat 2

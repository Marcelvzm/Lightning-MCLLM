      - { kind: snap, group: { name: showtec-2 }, values: { color/red: 255, color/green: 255, color/blue: 255, effect/macro: 0 } }
      - { kind: snap, group: { name: cameo-1 },   values: { color/red: 255, color/green: 255, color/blue: 255, dimmer: 255, effect/macro: 75 } }
  - at_beat: 8.6

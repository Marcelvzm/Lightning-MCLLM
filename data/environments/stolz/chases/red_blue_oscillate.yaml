# Splits oszillieren rot↔blau zwischen Front und Back. Spannungsvolle
# Komplementärbewegung.
name: red_blue_oscillate
description: Front+back wechseln zwischen rot↔blau, alle 4 Beats.
loop: true
length_beats: 8
steps:
  - at_beat: 0
    actions:
      - { kind: transition, group: { tag: front }, scene: pars_red_full,  fade_seconds: 0.5 }
      - { kind: transition, group: { tag: back },  scene: back_blue,      fade_seconds: 0.5 }
  - at_beat: 4
    actions:
      - { kind: transition, group: { tag: front }, scene: pars_blue_full, fade_seconds: 0.5 }
      - { kind: transition, group: { tag: back },  scene: back_red,       fade_seconds: 0.5 }

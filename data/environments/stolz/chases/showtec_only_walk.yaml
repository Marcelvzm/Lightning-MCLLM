# Showtec-Pars walken durch Farben.
name: showtec_only_walk
description: Showtecs walken durch RGB-Farben.
loop: true
length_beats: 16
steps:
  - at_beat: 0
    actions:
      - kind: transition
        group: { tag: showtec }
        values: { color/red: 255, color/green: 0, color/blue: 0, effect/macro: 0 }
        fade_seconds: 3.5
        easing: ease_in_out
  - at_beat: 4
    actions:
      - kind: transition
        group: { tag: showtec }
        values: { color/red: 0, color/green: 255, color/blue: 0, effect/macro: 0 }
        fade_seconds: 3.5
        easing: ease_in_out
  - at_beat: 8
    actions:
      - kind: transition
        group: { tag: showtec }
        values: { color/red: 0, color/green: 0, color/blue: 255, effect/macro: 0 }
        fade_seconds: 3.5
        easing: ease_in_out
  - at_beat: 12
    actions:
      - kind: transition
        group: { tag: showtec }
        values: { color/red: 200, color/green: 0, color/blue: 200, effect/macro: 0 }
        fade_seconds: 3.5
        easing: ease_in_out

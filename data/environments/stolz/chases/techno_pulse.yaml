# Minimaler 4OTF-Pulse für Techno — eine Farbe (deep blue), nur leichte
# Helligkeitsschwankung, kein Strobing. Hypnotisch.
name: techno_pulse
description: Minimaler 4OTF-Pulse für Techno (blau, dezent).
loop: true
length_beats: 4
steps:
  - at_beat: 0
    actions:
      - { kind: snap,       group: { tag: par }, values: { color/red: 0, color/green: 0, color/blue: 220, dimmer: 180 } }
      - { kind: transition, group: { tag: par }, values: { color/red: 0, color/green: 0, color/blue: 220, dimmer: 100 }, fade_seconds: 0.6 }
  - at_beat: 1
    actions:
      - { kind: snap,       group: { tag: par }, values: { color/red: 0, color/green: 0, color/blue: 220, dimmer: 180 } }
      - { kind: transition, group: { tag: par }, values: { color/red: 0, color/green: 0, color/blue: 220, dimmer: 100 }, fade_seconds: 0.6 }
  - at_beat: 2
    actions:
      - { kind: snap,       group: { tag: par }, values: { color/red: 0, color/green: 0, color/blue: 220, dimmer: 180 } }
      - { kind: transition, group: { tag: par }, values: { color/red: 0, color/green: 0, color/blue: 220, dimmer: 100 }, fade_seconds: 0.6 }
  - at_beat: 3
    actions:
      - { kind: snap,       group: { tag: par }, values: { color/red: 0, color/green: 0, color/blue: 220, dimmer: 180 } }
      - { kind: transition, group: { tag: par }, values: { color/red: 0, color/green: 0, color/blue: 220, dimmer: 100 }, fade_seconds: 0.6 }

name: white_pulse
description: 4OTF weiß pulse — peak intensity. Use sparingly.
loop: true
length_beats: 4
steps:
  - at_beat: 0
    actions:
      - { kind: snap,       group: { tag: par }, scene: pars_white_full }
      - { kind: transition, group: { tag: par }, values: { color/white: 50, dimmer: 30 }, fade_seconds: 0.3 }
  - at_beat: 1
    actions:
      - { kind: snap,       group: { tag: par }, scene: pars_white_full }
      - { kind: transition, group: { tag: par }, values: { color/white: 50, dimmer: 30 }, fade_seconds: 0.3 }
  - at_beat: 2
    actions:
      - { kind: snap,       group: { tag: par }, scene: pars_white_full }
      - { kind: transition, group: { tag: par }, values: { color/white: 50, dimmer: 30 }, fade_seconds: 0.3 }
  - at_beat: 3
    actions:
      - { kind: snap,       group: { tag: par }, scene: pars_white_full }
      - { kind: transition, group: { tag: par }, values: { color/white: 50, dimmer: 30 }, fade_seconds: 0.3 }

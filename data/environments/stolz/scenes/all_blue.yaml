# "Alle blau" — Test-Gegenstück zu all_red. Wenn die Bar von Rot auf Blau
# wechselt, wissen wir dass die Engine neue Werte ans Rig schickt.
name: all_blue
description: Alles blau — Bar (color-wheel 34), Pars (RGB direct, 100% blue).
targets:
  - select: { tag: bar }
    values:
      position/pan: 128
      position/pan_fine: 0
      position/tilt: 128
      position/tilt_fine: 0
      movement/speed: 0
      color/wheel: 34          # Blau (Range 030-039)
      gobo/wheel: 0
      strobe: 0
      dimmer: 255

  - select: { tag: par }
    values:
      dimmer: 255
      color/red: 0
      color/green: 0
      color/blue: 255
      color/white: 0
      strobe: 0
      effect/macro: 0

  - select: { tag: cameo }
    values:
      effect/macro: 32         # Blue preset (Range 027-037)

  # RX350 — 2CH, "blaue LEDs only" preset (Wert 57 = Mitte 046-068).
  - select: { name: rx350 }
    values:
      effect/macro: 57
      strobe: 0

# Gesamtes Rig in einer Palette. Tag-basiert komponiert — entfernst du
# einzelne Fixtures aus environment.yaml (z.B. die Varytec), funktioniert
# die Scene weiter, sie matcht einfach die verbleibenden Fixtures.
#
# Aufruf:
#   snap_scene("all_color")                 → defaults: rot
#   snap_scene("all_color", args={"col": "blau"})
name: all_color
description: Gesamtes Rig in einer Palette (rot / blau / gruen / weiss / warm).

parameters:
  col:
    type: str
    default: rot
    options: [rot, blau, gruen, weiss, warm]
    description: "Palette-Name aus palettes.yaml."

targets:
  # Bar-Heads — color-wheel + zentrale Position + voller Dimmer
  - select: { tag: bar }
    palette: { name: "${col}", facet: wheel }
    values:
      position/pan: 128
      position/pan_fine: 0
      position/tilt: 128
      position/tilt_fine: 0
      movement/speed: 0
      gobo/wheel: 0
      strobe: 0
      dimmer: 255

  # Alle direkt-RGB-Pars (Cameos, Showtecs, Varytec, PAR-64, …) — RGB facet
  - select: { tag: par }
    palette: { name: "${col}", facet: rgb }
    values:
      dimmer: 255
      strobe: 0

  # Cameos — zusätzlich macro-Override schreiben (sonst macro=0=Blackout)
  - select: { tag: cameo }
    palette: { name: "${col}", facet: cameo }

  # Showtecs — explizit Mode 0 = RGB-Direkt
  - select: { tag: showtec }
    values:
      effect/macro: 0

  # RX350 (Effect-Bar im 2CH-Mode) — eigenes Macro-Mapping
  - select: { tag: beam_bar }
    palette: { name: "${col}", facet: rx350 }
    values:
      strobe: 0

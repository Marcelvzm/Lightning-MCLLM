# "Alle rot" — über alle Fixture-Typen die wir bisher gepatched haben.
# Bar nutzt indexed Color-Wheel, Pars nutzen direkte RGB. Engine ignoriert
# Rollen, die ein Fixture nicht hat — eine Scene mit beidem funktioniert
# auf gemischten Rigs.
name: all_red
description: Alles rot — Bar (color-wheel 14), Pars (RGB direct, 100% red).
targets:
  # Bar — indexed color wheel
  - select: { tag: bar }
    values:
      position/pan: 128
      position/pan_fine: 0
      position/tilt: 128
      position/tilt_fine: 0
      movement/speed: 0
      color/wheel: 14
      gobo/wheel: 0
      strobe: 0
      dimmer: 255

  # Pars — direct RGB
  - select: { tag: par }
    values:
      dimmer: 255
      color/red: 255
      color/green: 0
      color/blue: 0
      color/white: 0
      strobe: 0
      effect/macro: 0

  # Cameo macro override — testen ob macro=10 (red preset) das RGB-Problem
  # umgeht. Falls die Cameos jetzt rot leuchten: macro=0 schluckte RGB.
  - select: { tag: cameo }
    values:
      effect/macro: 10

  # RX350 — 2CH, "rote LEDs only" preset auf Kanal 1 (Wert 11 = Mitte 001-022).
  - select: { name: rx350 }
    values:
      effect/macro: 11
      strobe: 0

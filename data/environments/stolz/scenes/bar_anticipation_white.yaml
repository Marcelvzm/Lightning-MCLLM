name: bar_anticipation_white
description: Bar-Heads white, frozen — neutral anticipation halt.

parameters:
  gobo: { type: int, default: 0, min: 0, max: 255 }

targets:
  - select: { tag: bar }
    palette: { name: weiss, facet: wheel }
    values:
      position/pan: 128
      position/tilt: 128
      movement/speed: 0
      gobo/wheel: "${gobo}"
      strobe: 0
      dimmer: 255

# Bar-Heads stehen still, alle weiß, voll bright. Klassisches
# "Anticipation Halt" — kurz vor dem Drop einfrieren als visuelles
# "Achtung jetzt kommt's"-Signal.
#
# Pars werden NICHT angefasst — sie können separat in eine andere Scene
# gefadet sein (z.B. dunkel als Kontrast).
name: bar_white_freeze
description: Bar-Heads in white, frozen. Anticipation Halt.

parameters:
  gobo: { type: int, default: 0, min: 0, max: 255 }

targets:
  - select: { tag: bar }
    palette: { name: weiss, facet: wheel }
    values:
      position/pan: 128
      position/tilt: 128
      movement/speed: 0
      gobo/wheel: "${gobo}"
      strobe: 0
      dimmer: 255

# Bar-Heads schießen blau in die Decke. Bei Nebel: "Dome of light"-Effekt.
# Für ambient peaks, breakdowns, theatralische Momente.
name: cathedral_blue
description: Bar-Heads in die Decke, blau — Cathedral-Look.

parameters:
  gobo: { type: int, default: 0, min: 0, max: 255 }

targets:
  - select: { tag: bar }
    palette: { name: blau, facet: wheel }
    values:
      position/pan: 128
      position/tilt: 50
      movement/speed: 80
      gobo/wheel: "${gobo}"
      strobe: 0
      dimmer: 255

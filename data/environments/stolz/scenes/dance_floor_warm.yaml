# Bar-Heads tilten zur Tanzfläche, warmer Color, mid-bright.
# Klassisches "Wedding/Party-Reception"-Setup.
name: dance_floor_warm
description: Bar-Heads zum Floor, warm bright. Party-Look.

parameters:
  gobo: { type: int, default: 0, min: 0, max: 255 }

targets:
  - select: { tag: bar }
    palette: { name: warm, facet: wheel }
    values:
      position/pan: 128
      position/tilt: 220
      movement/speed: 80
      gobo/wheel: "${gobo}"
      strobe: 0
      dimmer: 220

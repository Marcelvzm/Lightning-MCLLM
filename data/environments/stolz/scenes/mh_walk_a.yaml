# Bewegungs-Waypoint A — Köpfe weit gespreizt, leichter Aufwärts-Sweep.
# Baseline: Color-Wheel rot (14), Dimmer 100 (= mittlere Grundhelligkeit).
# Speed: 80 (mittlere Geschwindigkeit, sichtbarer Sweep).
name: mh_walk_a
description: MH waypoint A — gespreizt, mittlere Höhe.
targets:
  - select: { name: head-1 }
    values:
      position/pan: 50
      position/tilt: 90
      movement/speed: 80
      color/wheel: 14
      dimmer: 100
      strobe: 0
  - select: { name: head-2 }
    values:
      position/pan: 110
      position/tilt: 130
      movement/speed: 80
      color/wheel: 14
      dimmer: 100
      strobe: 0
  - select: { name: head-3 }
    values:
      position/pan: 145
      position/tilt: 110
      movement/speed: 80
      color/wheel: 14
      dimmer: 100
      strobe: 0
  - select: { name: head-4 }
    values:
      position/pan: 205
      position/tilt: 95
      movement/speed: 80
      color/wheel: 14
      dimmer: 100
      strobe: 0

name: pars_blue_full
description: Pars saturated blue, full bright. Hard-coded für Chase-Verwendung.
targets:
  - select: { tag: par }
    palette: { name: blau, facet: rgb }
    values: { dimmer: 255, strobe: 0 }
  - select: { tag: cameo }
    palette: { name: blau, facet: cameo }
    values: { dimmer: 255 }
  - select: { tag: showtec }
    values: { effect/macro: 0 }

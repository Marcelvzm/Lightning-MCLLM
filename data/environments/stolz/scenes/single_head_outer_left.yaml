# Nur head-1 (linker äußerer Bar-Kopf) bestrahlt. Andere Heads aus.
# Klassisch theatralisch — "alone in the spotlight"-Look.
name: single_head_outer_left
description: Nur head-1 leuchtet, alle anderen Bar-Heads aus.

parameters:
  col: { type: str, default: weiss, options: [rot, blau, gruen, weiss, warm] }

targets:
  # Erst alle Heads dunkel
  - select: { tag: bar }
    values:
      dimmer: 0

  # Dann nur head-1 leuchten lassen
  - select: { tag: head-1 }
    palette: { name: "${col}", facet: wheel }
    values:
      position/pan: 128
      position/tilt: 165
      movement/speed: 100
      gobo/wheel: 0
      strobe: 0
      dimmer: 255

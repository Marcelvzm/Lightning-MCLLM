# Vorne warm (amber), hinten kalt (blau). Nutzt die Wahrnehmungs-
# konvention "warm = forward, cold = back" für Tiefe.
name: split_warm_cold
description: Front warm (amber), Back kalt (blau) — Tiefen-Illusion.

parameters:
  gobo: { type: int, default: 0, min: 0, max: 255 }

targets:
  - select: { tag: bar }
    palette: { name: warm, facet: wheel }
    values: { dimmer: 200, gobo/wheel: "${gobo}", strobe: 0 }

  - select: { tags: [par, front] }
    palette: { name: warm, facet: rgb }
    values: { dimmer: 200, strobe: 0 }

  - select: { tags: [par, front, cameo] }
    palette: { name: warm, facet: cameo }
    values: { dimmer: 200 }

  - select: { tag: back }
    palette: { name: blau, facet: rgb }
    values: { dimmer: 150, strobe: 0 }

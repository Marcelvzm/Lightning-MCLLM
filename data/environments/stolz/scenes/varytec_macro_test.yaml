# Diagnostik-Scene: macht das Varytec überhaupt was bei ch6/ch7?
# Master Dimmer voll, RGB null, dann ch7 (macro) auf 16 = "Farbmischung mit
# Wechsel 1" (das erste Auto-Programm). Wenn der Pad jetzt anfängt
# eigenständig Farben zu spielen, wissen wir: DMX kommt an, Mode ist DMX,
# nur RGB-Direktsteuerung tut aus irgendeinem Grund nicht.
name: varytec_macro_test
description: Diagnose — Varytec auf Macro-Programm 1 (Farbmischung mit Wechsel).
targets:
  - select: { name: pad-1 }
    values:
      dimmer: 255
      color/red: 0
      color/green: 0
      color/blue: 0
      color/white: 0
      strobe: 0
      effect/macro: 16

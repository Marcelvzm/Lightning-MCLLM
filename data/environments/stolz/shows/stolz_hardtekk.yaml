# Hardtekk Show v2 — fast paced, multi-layered, no static moments.
#
# Was vorher schief lief:
# 1. Heads ruckelig → walk scenes hatten movement/speed=80 (mech. Dämpfung).
#    Jetzt speed=0 → smoothes engine-driven Movement.
# 2. Bar dunkel nach Cuts → bar_drift_* schreibt nur Position. Vor jedem
#    Bar-Drift wird jetzt explizit eine Bar-Color-Scene gesnapt (bar_red,
#    bar_blue etc.) damit Color+Dimmer da sind.
# 3. Pars zu statisch → in jeder Sektion läuft mind. ein Par-Chase
#    (red/blue/green/double_time pulse, fast_color_jump, hardtekk_density,
#    pars_random_blinks). Nichts ist je nur "wash + nichts".
#
# Strukturell: 18 Sektionen, je 2-3 simultane Chases. Sektions-Längen 4-30s.
# 4 1-bar Cuts (1.5s @ BPM 165) als Hardtekk-Signature-Punctuation.

name: stolz_hardtekk
description: Hardtekk-Show v2 — schnell, mehrlagig, ohne statische Momente.
bpm: 165
loop: true

keybindings:
  "1": { kind: scene, name: all_color, label: "Rot" }
  "2": { kind: scene, name: all_color, label: "Blau" }
  "3": { kind: scene, name: all_color, label: "Weiß" }
  "S": { kind: chase, name: strobe_volley, label: "Volley" }
  "B": { kind: blackout, label: "Blackout" }
  "R": { kind: release_blackout, label: "Release" }

script:
  - { do: set_bpm, bpm: 165 }

  # ── 0:00-0:14 — Intro: pars double-time pulse, bar pulse rot ────────
  - { do: log, message: "intro — already in motion" }
  - { do: snap_scene, scene: blackout, fade: 0 }
  - { do: snap_scene, scene: bar_red, fade: 0.5 }
  - { do: start_chase, chase: bar_red_pulse }
  - { do: start_chase, chase: double_time_pulse }
  - { do: wait, seconds: 14 }

  # ── 0:14-0:30 — White Kick-Stamps + Bar Drift ───────────────────────
  - { do: log, message: "white kick stamps + drift" }
  - { do: stop_all_chases }
  - { do: snap_scene, scene: bar_white, fade: 0.2 }
  - { do: start_chase, chase: hardtekk_density }
  - { do: start_chase, chase: bar_drift_fast }
  - { do: wait, seconds: 16 }

  # ── 0:30-0:32 — 1-Bar Cut ───────────────────────────────────────────
  - { do: stop_all_chases }
  - { do: blackout, fade: 0 }
  - { do: wait, seconds: 1.5 }
  - { do: release_blackout }

  # ── 0:32-0:48 — RED phase: pulse + drift + asymmetric blinks ────────
  - { do: log, message: "RED phase — multi-layer" }
  - { do: snap_scene, scene: pars_red_full, fade: 0.2 }
  - { do: snap_scene, scene: bar_red, fade: 0.2 }
  - { do: start_chase, chase: red_pulse }
  - { do: start_chase, chase: bar_drift_fast }
  - { do: start_chase, chase: pars_random_blinks }
  - { do: wait, seconds: 16 }

  # ── 0:48-0:54 — STROBE VOLLEY (kurz, hart) ──────────────────────────
  - { do: log, message: "strobe volley" }
  - { do: stop_all_chases }
  - { do: start_chase, chase: strobe_volley }
  - { do: wait, seconds: 6 }

  # ── 0:54-0:56 — Cut ─────────────────────────────────────────────────
  - { do: stop_all_chases }
  - { do: blackout, fade: 0 }
  - { do: wait, seconds: 1.5 }
  - { do: release_blackout }

  # ── 0:56-1:14 — BLUE phase: pulse + alternating bar + lift flashes ──
  - { do: log, message: "BLUE phase + lift flashes" }
  - { do: snap_scene, scene: pars_blue_full, fade: 0.2 }
  - { do: snap_scene, scene: bar_blue, fade: 0.2 }
  - { do: start_chase, chase: blue_pulse }
  - { do: start_chase, chase: bar_alternating }
  - { do: start_chase, chase: lift_flash }
  - { do: wait, seconds: 18 }

  # ── 1:14-1:28 — Magenta inline + diagonal sweep + asymmetric blinks ─
  - { do: log, message: "MAGENTA + diagonal" }
  - { do: stop_all_chases }
  - { do: set_values, group: { tag: par }, values: { color/red: 220, color/green: 0, color/blue: 200, dimmer: 220, strobe: 0 }, fade: 0.3 }
  - { do: snap_scene, scene: bar_blue, fade: 0.2 }
  - { do: start_chase, chase: bar_diagonal_sweep }
  - { do: start_chase, chase: pars_random_blinks }
  - { do: wait, seconds: 14 }

  # ── 1:28-1:30 — Cut ─────────────────────────────────────────────────
  - { do: stop_all_chases }
  - { do: blackout, fade: 0 }
  - { do: wait, seconds: 1.5 }
  - { do: release_blackout }

  # ── 1:30-1:42 — Quick color jumps + bar walk ────────────────────────
  - { do: log, message: "quick color jumps" }
  - { do: snap_scene, scene: bar_red, fade: 0.2 }
  - { do: start_chase, chase: fast_color_jump }
  - { do: start_chase, chase: bar_color_walk }
  - { do: start_chase, chase: bar_drift_fast }
  - { do: wait, seconds: 12 }

  # ── 1:42-2:00 — Strobe Build (escalating) ───────────────────────────
  - { do: log, message: "strobe build escalation" }
  - { do: stop_all_chases }
  - { do: snap_scene, scene: bar_anticipation_red, fade: 0.2 }
  - { do: start_chase, chase: strobe_build_8bar }
  - { do: wait, seconds: 18 }

  # ── 2:00-2:30 — MAIN DROP: full peak (30s) ──────────────────────────
  - { do: log, message: "MAIN DROP" }
  - { do: stop_all_chases }
  - { do: snap_scene, scene: hardstyle_drop, fade: 0 }
  - { do: snap_scene, scene: bar_red, fade: 0 }
  - { do: start_chase, chase: hardtekk_density }
  - { do: start_chase, chase: mh_drift_blinks }
  - { do: start_chase, chase: pars_random_blinks }
  - { do: wait, seconds: 30 }

  # ── 2:30-2:32 — Cut ─────────────────────────────────────────────────
  - { do: stop_all_chases }
  - { do: blackout, fade: 0 }
  - { do: wait, seconds: 1.5 }
  - { do: release_blackout }

  # ── 2:32-2:46 — Green stab phase + bar alternating ──────────────────
  - { do: log, message: "GREEN stab" }
  - { do: snap_scene, scene: pars_green_full, fade: 0.2 }
  - { do: snap_scene, scene: bar_green, fade: 0.2 }
  - { do: start_chase, chase: green_pulse }
  - { do: start_chase, chase: bar_alternating }
  - { do: start_chase, chase: pars_random_blinks }
  - { do: wait, seconds: 14 }

  # ── 2:46-3:00 — Mixed: half-time + bar drift + cameo walk ───────────
  - { do: log, message: "half-time variety" }
  - { do: stop_all_chases }
  - { do: snap_scene, scene: pars_red_full, fade: 0.2 }
  - { do: snap_scene, scene: bar_red, fade: 0.2 }
  - { do: start_chase, chase: half_time_pulse }
  - { do: start_chase, chase: bar_drift_slow }
  - { do: start_chase, chase: cameo_only_walk }
  - { do: wait, seconds: 14 }

  # ── 3:00-3:18 — Stripped break: techno_atmo + breath_pulse ──────────
  - { do: log, message: "atmospheric strip" }
  - { do: stop_all_chases }
  - { do: snap_scene, scene: techno_atmo, fade: 2.0 }
  - { do: start_chase, chase: breath_pulse }
  - { do: wait, seconds: 18 }

  # ── 3:18-3:20 — Cut ─────────────────────────────────────────────────
  - { do: stop_all_chases }
  - { do: blackout, fade: 0 }
  - { do: wait, seconds: 1.5 }
  - { do: release_blackout }

  # ── 3:20-3:34 — Build back: quarter strobe + drift ──────────────────
  - { do: log, message: "build back" }
  - { do: snap_scene, scene: bar_red, fade: 0.2 }
  - { do: start_chase, chase: quarter_strobe_loop }
  - { do: start_chase, chase: bar_drift_fast }
  - { do: wait, seconds: 14 }

  # ── 3:34-3:54 — Strobe build (proper escalation, 32 beats ≈ 11.6s) ──
  - { do: log, message: "second strobe build" }
  - { do: stop_all_chases }
  - { do: snap_scene, scene: bar_anticipation_white, fade: 0.2 }
  - { do: start_chase, chase: strobe_build_8bar }
  - { do: wait, seconds: 20 }

  # ── 3:54-4:30 — FINAL PEAK (36s, multi-layer maximum density) ───────
  - { do: log, message: "FINAL PEAK" }
  - { do: stop_all_chases }
  - { do: snap_scene, scene: hardstyle_drop, fade: 0 }
  - { do: snap_scene, scene: bar_red, fade: 0 }
  - { do: start_chase, chase: hardtekk_density }
  - { do: start_chase, chase: mh_drift_blinks }
  - { do: start_chase, chase: pars_random_blinks }
  - { do: start_chase, chase: bar_diagonal_sweep }
  - { do: wait, seconds: 36 }

  # ── 4:30-4:36 — Strobe burst + Cut ──────────────────────────────────
  - { do: stop_all_chases }
  - { do: start_chase, chase: strobe_volley }
  - { do: wait, seconds: 4.5 }
  - { do: stop_all_chases }
  - { do: blackout, fade: 0 }
  - { do: wait, seconds: 1.5 }
  - { do: release_blackout }

  # ── 4:36-4:54 — Wind down: cameo walk + bar color walk + amber pars ─
  - { do: log, message: "wind down" }
  - { do: snap_scene, scene: pars_amber_full, fade: 1.0 }
  - { do: snap_scene, scene: bar_red, fade: 0.5 }
  - { do: start_chase, chase: cameo_only_walk }
  - { do: start_chase, chase: bar_color_walk }
  - { do: wait, seconds: 18 }

  # ── 4:54-5:00 — Outro fade ──────────────────────────────────────────
  - { do: log, message: "outro fade" }
  - { do: stop_all_chases }
  - { do: snap_scene, scene: pars_red_dim, fade: 4.0 }
  - { do: snap_scene, scene: bar_red, fade: 0.5 }
  - { do: start_chase, chase: bar_red_pulse }
  - { do: wait, seconds: 6 }

  - { do: log, message: "hardtekk cycle complete" }

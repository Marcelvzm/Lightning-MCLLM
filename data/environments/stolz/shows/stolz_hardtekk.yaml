# Hardtekk — ~5 Minuten Show, schnell, hart, sehr viele Sektionen.
#
# Genre-Vokabular (aus genre_concepts/hardtekk.md):
# * white kick stamps auf jedem Beat = genre's heartbeat
# * 1-bar full blackouts als Signature-Punctuation (1.5s @ BPM 165)
# * Strobe volleys 2-4 bars während builds
# * Color stab phases — Phrase in einer Farbe, dann swap mit Cut-Buffer
# * Density drops — abrupte state changes
# * Atmospheric strips zwischen Peaks
#
# 23 Sektionen über ~298s (5 Min). Sektions-Längen variieren stark
# (1.5s cuts vs 30s sustained density) für die "blitzen + blinken"-Dynamik.
#
# BPM 165 — am unteren Hardtekk-Spektrum, gut tanzbar.

name: stolz_hardtekk
description: Hardtekk-Show — schnell, viele Cuts, color stabs, strobe volleys.
bpm: 165
loop: true

keybindings:
  "1": { kind: scene, name: all_color, label: "Rot" }
  "2": { kind: scene, name: all_color, label: "Blau" }
  "3": { kind: scene, name: all_color, label: "Weiß" }
  "S": { kind: chase, name: strobe_volley, label: "Volley" }
  "B": { kind: blackout, label: "Blackout" }
  "R": { kind: release_blackout, label: "Release" }

script:
  # BPM explizit setzen (das `bpm:`-Top-Level-Field wird vom ShowRunner zwar
  # beim Play angewendet, kann aber von einer früheren Tap-Tempo-Session
  # überlebt werden. Ein expliziter Reset zur Script-Zeit garantiert das
  # gewünschte Tempo).
  - { do: set_bpm, bpm: 165 }

  # ── 0:00-0:18 — Intro: rot rüsten + langsame Bar-Drift ──────────────
  - { do: log, message: "intro" }
  - { do: snap_scene, scene: blackout, fade: 0 }
  - { do: snap_scene, scene: pars_red_dim, fade: 4.0 }
  - { do: start_chase, chase: bar_drift_slow }
  - { do: wait, seconds: 18 }

  # ── 0:18-0:36 — White Kick-Stamps Phase (genre heartbeat) ───────────
  - { do: log, message: "white kick stamps" }
  - { do: stop_all_chases }
  - { do: start_chase, chase: hardtekk_density }
  - { do: wait, seconds: 18 }

  # ── 0:36-0:38 — 1-Bar BLACKOUT cut ──────────────────────────────────
  - { do: stop_all_chases }
  - { do: blackout, fade: 0 }
  - { do: wait, seconds: 1.5 }
  - { do: release_blackout }

  # ── 0:38-0:56 — Red Stab Phase: 4OTF + Bar Drift ────────────────────
  - { do: log, message: "RED stab" }
  - { do: snap_scene, scene: pars_red_full, fade: 0.3 }
  - { do: start_chase, chase: red_pulse }
  - { do: start_chase, chase: bar_drift_fast }
  - { do: wait, seconds: 18 }

  # ── 0:56-1:04 — STROBE VOLLEY (8s burst) ────────────────────────────
  - { do: log, message: "STROBE VOLLEY" }
  - { do: stop_all_chases }
  - { do: start_chase, chase: strobe_volley }
  - { do: wait, seconds: 8 }

  # ── 1:04-1:06 — 1-Bar BLACKOUT cut ──────────────────────────────────
  - { do: stop_all_chases }
  - { do: blackout, fade: 0 }
  - { do: wait, seconds: 1.5 }
  - { do: release_blackout }

  # ── 1:06-1:24 — Blue Stab Phase + Lift-Flashes ──────────────────────
  - { do: log, message: "BLUE stab + lifts" }
  - { do: snap_scene, scene: pars_blue_full, fade: 0.3 }
  - { do: start_chase, chase: blue_pulse }
  - { do: start_chase, chase: lift_flash }
  - { do: start_chase, chase: bar_alternating }
  - { do: wait, seconds: 18 }

  # ── 1:24-1:36 — Density Drop: drift+blinks zugefügt ─────────────────
  - { do: log, message: "density drop" }
  - { do: stop_chase, chase: bar_alternating }
  - { do: start_chase, chase: mh_drift_blinks }
  - { do: wait, seconds: 12 }

  # ── 1:36-1:38 — 1-Bar Cut ───────────────────────────────────────────
  - { do: stop_all_chases }
  - { do: blackout, fade: 0 }
  - { do: wait, seconds: 1.5 }
  - { do: release_blackout }

  # ── 1:38-1:54 — Magenta stab Phase (inline values, kein scene) ──────
  - { do: log, message: "MAGENTA stab" }
  - { do: set_values, group: { tag: par }, values: { color/red: 220, color/green: 0, color/blue: 200, dimmer: 220, strobe: 0 }, fade: 0.3 }
  - { do: start_chase, chase: hardtekk_density }
  - { do: start_chase, chase: bar_diagonal_sweep }
  - { do: wait, seconds: 16 }

  # ── 1:54-2:14 — Strobe Build (escalating) ───────────────────────────
  - { do: log, message: "strobe build escalation" }
  - { do: stop_all_chases }
  - { do: snap_scene, scene: bar_anticipation_red, fade: 0.3 }
  - { do: start_chase, chase: strobe_build_8bar }
  - { do: wait, seconds: 20 }

  # ── 2:14-2:42 — MAIN DROP: full peak (28s) ──────────────────────────
  - { do: log, message: "MAIN DROP" }
  - { do: stop_all_chases }
  - { do: snap_scene, scene: hardstyle_drop, fade: 0 }
  - { do: start_chase, chase: hardtekk_density }
  - { do: start_chase, chase: mh_drift_blinks }
  - { do: wait, seconds: 28 }

  # ── 2:42-2:44 — 1-Bar Cut ───────────────────────────────────────────
  - { do: stop_all_chases }
  - { do: blackout, fade: 0 }
  - { do: wait, seconds: 1.5 }
  - { do: release_blackout }

  # ── 2:44-2:56 — Quick color jumps (4 colors per phrase) ─────────────
  - { do: log, message: "fast color jumps" }
  - { do: start_chase, chase: fast_color_jump }
  - { do: start_chase, chase: bar_drift_fast }
  - { do: wait, seconds: 12 }

  # ── 2:56-3:14 — Green stab Phase ────────────────────────────────────
  - { do: log, message: "GREEN stab" }
  - { do: stop_all_chases }
  - { do: snap_scene, scene: pars_green_full, fade: 0.3 }
  - { do: start_chase, chase: green_pulse }
  - { do: start_chase, chase: mh_alternating_sweep }
  - { do: wait, seconds: 18 }

  # ── 3:14-3:34 — STRIPPED-BACK: atmosphere only (Hardtekk reset) ─────
  - { do: log, message: "atmospheric strip-back" }
  - { do: stop_all_chases }
  - { do: snap_scene, scene: techno_atmo, fade: 3.0 }
  - { do: wait, seconds: 20 }

  # ── 3:34-3:36 — 1-Bar Cut ───────────────────────────────────────────
  - { do: blackout, fade: 0 }
  - { do: wait, seconds: 1.5 }
  - { do: release_blackout }

  # ── 3:36-3:54 — Build back: Quarter-beat strobe ─────────────────────
  - { do: log, message: "build back — quarter strobe" }
  - { do: snap_scene, scene: pars_red_dim, fade: 0.3 }
  - { do: start_chase, chase: quarter_strobe_loop }
  - { do: start_chase, chase: bar_drift_fast }
  - { do: wait, seconds: 18 }

  # ── 3:54-4:24 — FINAL PEAK: 30s drift+stamps+pulse ──────────────────
  - { do: log, message: "FINAL PEAK" }
  - { do: stop_all_chases }
  - { do: snap_scene, scene: hardstyle_drop, fade: 0 }
  - { do: start_chase, chase: hardtekk_density }
  - { do: start_chase, chase: mh_drift_blinks }
  - { do: wait, seconds: 30 }

  # ── 4:24-4:30 — Strobe blast + 1-bar cut ────────────────────────────
  - { do: stop_all_chases }
  - { do: start_chase, chase: strobe_volley }
  - { do: wait, seconds: 4.5 }
  - { do: stop_all_chases }
  - { do: blackout, fade: 0 }
  - { do: wait, seconds: 1.5 }
  - { do: release_blackout }

  # ── 4:30-4:50 — Sustained low density (color walk on bar) ───────────
  - { do: log, message: "wind down — color walk" }
  - { do: snap_scene, scene: pars_amber_full, fade: 1.0 }
  - { do: start_chase, chase: bar_color_walk }
  - { do: wait, seconds: 20 }

  # ── 4:50-5:00 — Outro: fade zurück Richtung intro state ─────────────
  - { do: log, message: "outro fade" }
  - { do: stop_all_chases }
  - { do: snap_scene, scene: pars_red_dim, fade: 8.0 }
  - { do: wait, seconds: 10 }

  - { do: log, message: "hardtekk cycle complete" }

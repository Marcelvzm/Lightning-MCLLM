# =============================================================================
# Eurolite LED PAR-64 RGB Spot — 5-channel mode
# =============================================================================
#
# Klassischer LED-PAR-Can in PAR-64-Bauform, RGB-Direktansteuerung.
# 5 DMX-Channels.
#
# Layout (start address = N) — gemäß User-Manual:
#
#   offset | ch | role        | value range and meaning
#   -------|----|-------------|--------------------------------------------------
#   0      | N  | color/red   | 000-255    Rot 0-100%
#   1      | N+1| color/green | 000-255    Grün 0-100%
#   2      | N+2| color/blue  | 000-255    Blau 0-100%
#   3      | N+3| dimmer      | 000-255    Master-Dimmer 0-100%
#   4      | N+4| strobe      | 000-010    Strobe aus (steady)
#                             | 011-255    Strobe-Rate, langsam → schnell
#
# WICHTIG: Master-Dimmer sitzt auf Kanal 4 (NACH den RGB-Kanälen). Damit
# überhaupt Licht rauskommt, muss der Dimmer ≥1 sein — RGB allein reicht
# nicht. Bei Dimmer=0 ist alles aus, egal was an RGB anliegt.
#
# Setzen von Mode + Adresse hängt vom genauen Modell ab — typische Eurolite-
# PAR-64-Bedienung über 4-Tasten-Menü oder DIP-Switches.
#
# =============================================================================

name: eurolite_led_par_64_rgb_spot
description: Eurolite LED PAR-64 RGB Spot — 5-channel mode (R, G, B, dimmer, strobe).
manufacturer: eurolite
model: led_par_64_rgb_spot

channels:
  - { offset: 0, role: color/red,   default: 0 }
  - { offset: 1, role: color/green, default: 0 }
  - { offset: 2, role: color/blue,  default: 0 }
  - { offset: 3, role: dimmer,      default: 0, description: "master dimmer 0-100% — auf KANAL 4, nicht 1!" }
  - offset: 4
    role: strobe
    default: 0
    description: "0-10 = aus (steady), 11-255 = strobe rate langsam→schnell."
    presets: { off: 0, slow: 30, medium: 120, fast: 220 }

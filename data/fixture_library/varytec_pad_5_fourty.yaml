# Varytec LED Pad 5 Fourty — 5x8W RGBW LED par.
# Single DMX mode: 7 channels.
# Quirks vs. generic_rgbw_par:
#   * Strobe channel (6) is split-range: 1-15 = strobe rate, 16-94 = silent,
#     95-255 = built-in program speed. Don't write strobe values >15 if you
#     just want strobing. Presets below stay safely inside the strobe range.
#   * Channel 7 triggers internal colour-mix programs (color macros).
name: varytec_pad_5_fourty
description: Varytec LED Pad 5 Fourty — 5x8W RGBW LED par (7-channel mode)
manufacturer: varytec
model: led_pad_5_fourty
channels:
  - { offset: 0, role: dimmer, default: 0, description: "master dimmer 0-100%" }
  - { offset: 1, role: color/red, default: 0 }
  - { offset: 2, role: color/green, default: 0 }
  - { offset: 3, role: color/blue, default: 0 }
  - { offset: 4, role: color/white, default: 0 }
  - offset: 5
    role: strobe
    default: 0
    description: "0=off, 1-15=strobe rate (slow→fast). 16-94=quiet zone. 95-255=program speed."
    presets: { off: 0, slow: 4, medium: 8, fast: 14 }
  - offset: 6
    role: effect/macro
    default: 0
    description: "Color-mix macro trigger / program selection."
    presets: { none: 0 }

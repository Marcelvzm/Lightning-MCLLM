[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightning-mcllm"
version = "0.1.0"
description = "LLM-authored DMX lighting show controller for live performance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Marcel" }]
dependencies = [
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "pyserial>=3.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "watchfiles>=0.21",
    "websockets>=12",
    "click>=8.1",
    "anyio>=4.2",
]

[project.optional-dependencies]
audio = [
    "aubio>=0.4.9",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
lightning = "lightning_mcllm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lightning_mcllm"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
